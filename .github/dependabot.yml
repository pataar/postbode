version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      # Blitz paints into anyrender without re-exporting it, so both must move as one
      html-render:
        patterns: ["anyrender*", "blitz-*"]
      cargo:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    # Generated by `dist generate`; dist's own check fails on any hand or bot edit.
    exclude-paths:
      - .github/workflows/release.yml
    schedule:
      interval: weekly
    cooldown:
      default-days: 3
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: rust-toolchain
    directory: /
    schedule:
      interval: weekly
    commit-message:
      prefix: chore
      include: scope

  - package-ecosystem: docker-compose
    directory: /tests/dovecot
    schedule:
      interval: monthly
    commit-message:
      prefix: chore
      include: scope
