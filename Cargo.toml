[package]
name = "postbode"
version = "0.2.0"
edition = "2024"
rust-version = "1.99"
license = "MIT OR Apache-2.0"
description = "A fast, simple mail client with automatic mailbox rules"
documentation = "https://postbode.pataar.nl/"
repository = "https://github.com/pataar/postbode"
homepage = "https://postbode.pataar.nl/"
keywords = ["automation", "email", "email-client", "imap", "mail-filter"]
categories = ["command-line-utilities", "email"]
# Only what the build needs; keeps the test CA key, design docs and CI config out of the published crate.
include = ["/assets/fonts/**", "/assets/icon.png", "/CHANGELOG.md", "/Cargo.lock", "/LICENSE-*", "/README.md", "/docs/src/agent-guide.md", "/migrations/**", "/src/**"]

[dependencies]
anyhow = "1"                                         # error context in the binary and sync loop
anyrender = { version = "=0.13.0", optional = true }  # the drawing trait Blitz paints into; pinned to the version blitz-paint uses
anyrender_vello_cpu = { version = "=0.17.0", optional = true }  # CPU raster for Blitz, so HTML mail becomes an egui texture without a GPU path
async-imap = { version = "0.12", default-features = false, features = ["runtime-tokio"] }  # IMAP client, maintained, IDLE support
blitz-dom = { version = "=0.3.0-beta.2", optional = true, default-features = false, features = ["system-fonts", "svg", "floats"] }  # HTML mail: style and layout (Stylo, Taffy, Parley); beta, so pinned exactly
blitz-html = { version = "=0.3.0-beta.2", optional = true }  # HTML mail: html5ever parsing into a Blitz document
blitz-paint = { version = "=0.3.0-beta.2", optional = true }  # HTML mail: a laid-out document to draw commands
blitz-traits = { version = "=0.3.0-beta.2", optional = true }  # HTML mail: the net provider and viewport types
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }         # INTERNALDATE comes back as chrono; also list output
clap = { version = "4", features = ["derive"] }      # CLI
data-url = { version = "0.3", optional = true }  # data: URIs in HTML mail; already in the tree through usvg
directories = "6"                                    # platform config/state/cache dirs
eframe = { version = "0.36", optional = true, features = ["persistence"] }  # the GUI window (egui); default features: wgpu, winit with runtime-loaded X11/Wayland; persistence remembers window and pane sizes
egui-phosphor = { version = "0.14", optional = true }  # icon font for the GUI (folders, toolbar, views); targets egui 0.36
env_logger = "0.11"                                  # log output to stderr, RUST_LOG filter
futures-util = { version = "0.3", default-features = false }  # collect async-imap streams
globset = "0.4"                                      # alias globs
humantime = "2"                                      # "1h", "2d" in rules
include_dir = "0.7"                                  # embed migrations/ in the binary
keyring-core = "1"                                   # OS keyring API
log = "0.4"                                          # logging facade
mail-parser = "0.11"                                 # RFC 5322 header and body parsing
notify-rust = "4"                                    # desktop notifications from `run`
regex = "1"                                          # rule regex conditions
rmcp = { version = "3.5", optional = true, default-features = false, features = ["server", "transport-io"] }  # MCP server for `postbode mcp`, hand-written handler on stdio
rpassword = "7"                                      # hidden password prompt in `account add`
rusqlite = { version = "0.40", features = ["bundled"] }       # SQLite, bundled build includes FTS5
rusqlite_migration = { version = "2", features = ["from-directory"] }  # numbered SQL migrations
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }  # TLS without a C toolchain
schemars = "1"                                       # JSON Schema for rules.toml, generated from the rule types
serde = { version = "1", features = ["derive"] }     # config, rules, rows
serde_json = "1"                                     # --json output
serde_rusqlite = "0.43"                              # rows to structs
socket2 = { version = "0.6", features = ["all"] }     # TCP keepalive on the IMAP socket so dead connections fail; "all" exposes the retry count
sys-locale = { version = "0.3", optional = true }  # the device locale, to group digits in counts the way the user expects
thiserror = "2"                                      # user-facing error enums
tokio = { version = "1", features = ["rt", "net", "time", "macros"] }  # current-thread runtimes for async-imap and the MCP server
tokio-rustls = { version = "0.26", default-features = false, features = ["ring", "tls12", "logging"] }  # TLS stream for tokio
toml = "1"                                           # config.toml and rules.toml
toml_edit = "0.25"                                   # approve/reject edit rules.toml in place, keeping comments
webpki-roots = "1"                                   # root certificates
zeroize = "1"                                        # wipe secrets on drop

[target.'cfg(target_os = "macos")'.dependencies]
apple-native-keyring-store = { version = "1", features = ["keychain"] }  # macOS Keychain backend for keyring-core

[target.'cfg(target_os = "linux")'.dependencies]
fontique = { version = "0.11", optional = true, features = ["fontconfig-dlopen"] }  # HTML mail: load fontconfig at runtime, as eframe loads X11 and Wayland, instead of linking it
zbus-secret-service-keyring-store = { version = "1", features = ["rt-tokio-crypto-rust"] }  # Secret Service backend for keyring-core

[dev-dependencies]
clap-markdown = "0.1"                                # docs/src/cli.md generated from the clap definitions
egui_kittest = { version = "0.36", features = ["snapshot", "wgpu"] }  # headless GUI tests: press keys, find widgets by label; render views to PNG snapshots
proptest = { version = "1", default-features = false, features = ["std"] }  # tests/fuzz.rs (hostile input never panics the parsers) and tests/sync_model.rs (random sync event sequences, shrunk)
rmcp = { version = "3.5", default-features = false, features = ["client", "server", "transport-async-rw"] }  # in-process MCP client for the server tests
tempfile = "3"                                       # temp dirs for store and paths tests

[[test]]
name = "sync_model"
required-features = ["testing"]                      # drives sync against RecordingOps

[[test]]
name = "imap_live"
required-features = ["testing"]                      # drives sync::run_once and sync_all against Dovecot

[lints.rust]
unsafe_code = "forbid"                               # no unsafe in this crate; keep it that way

[package.metadata.cargo-machete]
ignored = ["fontique"]                               # only sets a feature of the fontique Blitz uses

[lints.clippy]
unwrap_used = "deny"                                 # shipped code returns errors instead of panicking
expect_used = "deny"                                 # same; allow narrowly where a call cannot fail
panic = "deny"                                       # no deliberate panics outside tests
todo = "deny"                                        # unfinished code does not ship
unimplemented = "deny"                               # same as todo
dbg_macro = "warn"                                   # debug output stays out of commits

[features]
default = ["gui", "html", "mcp"]
gui = ["dep:eframe", "dep:egui-phosphor", "dep:sys-locale"]           # `postbode gui`; off builds the CLI alone
html = ["gui", "dep:blitz-dom", "dep:blitz-html", "dep:blitz-paint", "dep:blitz-traits", "dep:anyrender", "dep:anyrender_vello_cpu", "dep:data-url", "dep:fontique"]  # HTML mail rendered in the body panel; off shows text
mcp = ["dep:rmcp"]                                   # `postbode mcp`; off builds without the MCP server
testing = []                                         # exposes RecordingOps and the one-shot sync steps to integration tests

[profile.dev.package."*"]
opt-level = 2

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

[profile.dist]
inherits = "release"
