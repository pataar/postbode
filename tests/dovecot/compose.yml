# The zz- prefix makes our conf files load after the image's own conf.d/ssl.conf, which would otherwise override ssl_server.
# Live IMAP test servers; see AGENTS.md. Any username logs in with USER_PASSWORD; mail lives only in the container.
services:
  dovecot:
    image: dovecot/dovecot:2.4.5
    environment:
      USER_PASSWORD: postvak-test
    ports:
      - "127.0.0.1:10993:31993"
    volumes:
      - ./certs:/etc/postvak-test:ro
      - ./postvak.conf:/etc/dovecot/conf.d/zz-postvak.conf:ro
  dovecot-without-move:
    image: dovecot/dovecot:2.4.5
    environment:
      USER_PASSWORD: postvak-test
    ports:
      - "127.0.0.1:11993:31993"
    volumes:
      - ./certs:/etc/postvak-test:ro
      - ./postvak.conf:/etc/dovecot/conf.d/zz-postvak.conf:ro
      - ./without-move.conf:/etc/dovecot/conf.d/zz-without-move.conf:ro
