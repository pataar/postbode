<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 2560 1280" xml:space="preserve">
  <rect width="2560" height="1280" fill="#3b1418"/>
  <g transform="translate(141 318) scale(1.5)">
    <path d="M18 8H102a7 7 0 0 1 4 12.5L64 50Q60 53 56 50L14 20.5A7 7 0 0 1 18 8Z" fill="#d9b36a"/>
    <path d="M12 28L52 56Q54 58 54 61V88L45 76H24Q12 76 12 64Z" fill="#f1e4d8"/>
    <path d="M108 28L68 56Q66 58 66 61V88L75 76H96Q108 76 108 64Z" fill="#f1e4d8"/>
  </g>
  <text x="364" y="440" font-family="Newsreader" font-weight="500" font-size="150" fill="#f1e4d8">Postvak</text>
  <g font-family="Hanken Grotesk" font-weight="500" font-size="68" fill="#f1e4d8">
    <text x="160" y="699">A fast IMAP mail client with rules</text>
    <text x="160" y="791">that keep your mailbox clean.</text>
  </g>
  <g fill="#5a2a2f">
    <rect x="160" y="884" width="151" height="66" rx="33"/>
    <rect x="335" y="884" width="293" height="66" rx="33"/>
    <rect x="652" y="884" width="340" height="66" rx="33"/>
  </g>
  <g font-family="Spline Sans Mono" font-weight="500" font-size="38" fill="#f1e4d8" text-anchor="middle">
    <text x="235.5" y="930">IMAP</text>
    <text x="481.5" y="930">rules.toml</text>
    <text x="822" y="930">local SQLite</text>
  </g>
  <rect x="1400" y="330" width="1000" height="620" rx="30" fill="#fbf8f3"/>
  <g font-family="Spline Sans Mono" font-weight="500" font-size="38" fill="#2b1a1c">
    <text x="1460" y="445" fill="#6e5958"># rules.toml</text>
    <text x="1460" y="505">[[rules]]</text>
    <text x="1460" y="565">name = <tspan fill="#9a4a1c">"purge sign-in codes"</tspan></text>
    <text x="1460" y="625">match.subject = { regex =</text>
    <text x="1460" y="685">  <tspan fill="#9a4a1c">"(?i)sign.?in|magic link"</tspan> }</text>
    <text x="1460" y="745">match.older_than = <tspan fill="#9a4a1c">"1h"</tspan></text>
    <text x="1460" y="805">match.seen = <tspan fill="#8c6720">true</tspan></text>
    <text x="1460" y="865">actions = [<tspan fill="#9a4a1c">"delete"</tspan>]</text>
  </g>
</svg>
